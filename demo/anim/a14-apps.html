<script>
  const $ = id => document.getElementById(id);
  const SLOT_X = [460, 960, 1460], UP = 150, SLOT_BOTTOM = 720 - UP;
  const APPS = [[300, "web"], [600, "phone"], [840, "web"], [1080, "phone"], [1330, "phone"], [1610, "web"]];
  const LINKS = APPS.map((a, i) => [Math.floor(i / 2), i]);
  const net = $("net"), appsEl = $("apps");
  const paths = LINKS.map(([s, a]) => {

    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("class", "link"); p.setAttribute("pathLength", "1");
    p.setAttribute("d", `M${x1} ${y1} C ${x1} ${y1 + 120}, ${x2} ${y2 - 120}, ${x2} ${y2}`);
    net.appendChild(p); return p;
  });
  const PILLS = [];
  LINKS.forEach((l, i) => { for (let j = 0; j < 3; j++) {
    const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    r.setAttribute("class", "pill"); r.setAttribute("width", 30); r.setAttribute("height", 10); r.setAttribute("rx", 5);
    net.appendChild(r); PILLS.push({ r, path: paths[i], at: 1.6 + j * 0.5 + (i % 3) * 0.09 + Math.floor(i / 2) * 0.05, app: i });
  }});
  const appEls = APPS.map(([x, kind], i) => {

    const up = A.p(t, 0.25, 0.9, "io");
    $("slots").style.transform = `translateY(${-UP * up}px)`;
    const lit = A.p(t, 1.0, 0.5, "soft");
    for (let s = 0; s < 3; s++) {
      $("s" + s).style.boxShadow = `0 0 ${40 * lit}px rgba(62,207,142,${0.22 * lit}), 0 30px 80px -30px rgba(0,0,0,.8)`;
      $("s" + s).style.borderColor = `rgba(62,207,142,${0.35 + 0.35 * lit})`;
    }
    paths.forEach((p, i) => { const k = A.p(t, 1.0 + i * 0.05, 0.7, "io"); p.style.strokeDasharray = "1 1"; p.style.strokeDashoffset = 1 - k; });
    appEls.forEach((a, i) => {
      const k = A.p(t, 0.9 + i * 0.07, 0.7, "out");
      a.style.opacity = k; a.style.transform = `translateY(${(1 - k) * 24}px)`;
    });
    $("cap").style.opacity = A.p(t, 1.6, 0.6);
    const got = APPS.map(() => 0);
    PILLS.forEach(pl => {
      const k = A.p(t, pl.at, 0.8, "io");
      const L = pl.path.getTotalLength(), pt = pl.path.getPointAtLength(k * L);
      pl.r.setAttribute("x", pt.x - 15); pl.r.setAttribute("y", pt.y - 5);

    appEls.forEach((a, i) => {
      a.style.borderColor = got[i] ? "rgba(62,207,142,.6)" : "";
      [...a.querySelectorAll("i")].forEach((b, j) => { b.style.background = j < got[i] ? "rgba(62,207,142,.6)" : ""; });
    });
  }
