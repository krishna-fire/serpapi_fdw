<script>
  const g = document.getElementById("group"), key = document.getElementById("key"), chip = document.getElementById("chip");
  const vault = document.getElementById("vault");
  const RED = [255, 95, 87], WHITE = [201, 208, 204], GREEN = [62, 207, 142];
  const mix = (a, b, k) => a.map((v, i) => Math.round(A.lerp(v, b[i], k)));
  function frame(t) {
    // browser slides left and recedes
    const b = A.p(t, 0.25, 1.1, "io");
    g.style.transform = `translate(${-470 * b}px, ${30 * b}px) scale(${1 - 0.42 * b})`;
    g.style.opacity = 1 - 0.55 * b;
    // vault rises in
    const v = A.p(t, 0.7, 0.8, "out");
    vault.style.opacity = v; vault.style.transform = `translateY(${(1 - v) * 50}px)`;
    // key: lift (0.1–0.6), then drop into the vault top (0.9–1.8)
    const lift = A.p(t, 0.1, 0.55, "out"), drop = A.p(t, 0.85, 0.95, "in");
    const x = 1427 + (0 - 0) , y = -70 * lift + (514 - 268 + 70) * drop;
    const s = 1 - 0.35 * A.p(t, 0.6, 1.1, "soft");
    key.style.transform = `translate(${-6 * lift}px, ${y}px) scale(${s})`;
    key.style.opacity = 1 - A.p(t, 1.62, 0.18, "lin");
    const c = t < 0.6 ? mix(RED, WHITE, A.p(t, 0.05, 0.5, "soft")) : mix(WHITE, GREEN, A.p(t, 0.6, 0.6, "soft"));
    const col = `rgb(${c.join(",")})`;
    chip.style.color = col; chip.style.borderColor = col;
    chip.style.boxShadow = `0 0 ${28 * (1 - A.p(t, 0, 0.5, "lin")) + 20 * A.p(t, 0.8, 0.5, "lin")}px rgba(${c.join(",")},.45)`;
    // clip the key behind the vault's top rim once it reaches it
    const clipY = 514 - 268 + 24;   // chip-local y of the rim's centre line at full drop
    const below = Math.max(0, (y + 24) - (514 - 268));
    key.style.clipPath = drop > 0 ? `inset(0 0 ${Math.min(48, below / s)}px 0)` : "none";
  }
