<script>
  const $ = id => document.getElementById(id);
  const CX = 960, CY = 550;
  function frame(t) {
    for (let i = 0; i < 5; i++) {
      const b = $("b" + i);
      const on = A.p(t, 0.4 + i * 0.62, 0.7, "out");
      const dim = A.p(t, 4.7, 0.6, "soft");
      // collapse: outer boxes first, all into the centre point
      const order = [0, 4, 1, 3, 2][i] ;
      const c = A.p(t, 5.3 + Math.abs(i - 2) * -0.08 + 0.16, 0.9, "io");
      const bx = 140 + i * 342 + 136, dx = (CX - bx) * c;
      b.style.opacity = on * A.lerp(1, 0.4, dim) * (1 - A.p(t, 5.75, 0.5, "lin"));
      b.style.transform = `translate(${dx}px, ${(1 - on) * 24}px) scale(${A.lerp(1, 0.25, c)})`;
      b.style.filter = dim > 0 ? `saturate(${1 - dim})` : "";
    }
    for (let i = 0; i < 4; i++) {
      const a = $("a" + i);
      a.style.opacity = A.p(t, 0.75 + i * 0.62, 0.4) * (1 - A.p(t, 4.7, 0.6)) ;
    }
    $("eb1").style.opacity = A.p(t, 0.1, 0.6) * (1 - A.p(t, 5.6, 0.4));
    $("eb2").style.opacity = A.p(t, 6.2, 0.5);
    // the SQL line unfolds out of the collapse point
    const s = A.p(t, 5.95, 0.9, "out");
    const sql = $("sql");
    sql.style.opacity = A.p(t, 5.95, 0.4, "lin");
    sql.style.clipPath = `inset(0 ${(1 - s) * 50}% 0 ${(1 - s) * 50}% round 22px)`;
    sql.style.transform = `scale(${A.lerp(0.96, 1, s)})`;
    $("foot").style.opacity = A.p(t, 7.9, 0.6);
    $("foot").style.transform = `translateY(${(1 - A.p(t, 7.9, 0.8)) * 14}px)`;
  }
</script>
