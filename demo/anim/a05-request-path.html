<script>
  const $ = id => document.getElementById(id);
  const world = $("world");
  const nodes = { sql: 1.8, fdw: 2.6, serp: 8.5, types: 9.8, row: 11.2 };
  const wires = [ // id, start, dur, path start/end for packet
    ["1", 2.1, 0.45, [600, 365], [690, 365]],
    ["2", 6.6, 0.75, [1002, 548], [1002, 468]],
    ["3", 7.9, 0.6, [1300, 360], [1468, 360]],
    ["4", 9.15, 0.6, [1478, 825], [1310, 825]],
    ["5", 10.75, 0.45, [700, 825], [610, 825]],
  ];
  const DIM = 0.28;
  function nodeState(el, t, on, keepRing = 1.4) {
    const k = A.p(t, on, 0.5, "soft");
    el.style.opacity = A.lerp(DIM, 1, k);
    const ring = el.querySelector(".ring");
    if (ring) ring.style.opacity = A.p(t, on, 0.3, "soft") * (1 - A.p(t, on + keepRing, 0.7, "soft"));
  }
  function frame(t) {
    // camera: from the grid row (big, centred) back to the whole path
    const z = A.p(t, 0.1, 1.8, "io");
    const s = A.lerp(2.5, 1, z);
    world.style.transform = `translate(${(960 - 370) * (1 - z)}px, ${(560 - 820) * (1 - z)}px) scale(${s})`;

    for (const [id, on] of Object.entries(nodes)) {
      if (id === "row") continue;
      nodeState($(id), t, on);
    }
    // row: lit at the start (it is the row we zoomed out of), dims, then lights again at the end
    const rowOn = 1 - A.p(t, 1.6, 0.5, "soft") + A.p(t, nodes.row, 0.5, "soft");
    $("row").style.opacity = A.lerp(DIM, 1, Math.min(1, rowOn));
    $("row").querySelector(".ring").style.opacity = A.p(t, nodes.row, 0.3) ;
    $("cells").style.opacity = A.lerp(1, 0.25, A.p(t, 1.6, 0.4)) + 0.75 * A.p(t, nodes.row + 0.15, 0.4);
    $("fdw").querySelector(".ring").style.opacity = 0;   // the FDW gets the persistent highlight box instead

    // vault (no ring, it is not a box)
    $("vault").style.opacity = A.lerp(DIM, 1, A.p(t, 6.2, 0.5, "soft"));
    $("vtop").style.stroke = A.p(t, 6.2, 0.4) > 0.5 && t < 7.8 ? "#3ECF8E" : "#3a4440";
    // Postgres boundary lights when the voice says "inside Postgres"
    const pg = A.p(t, 4.6, 0.6, "soft");
    $("pg").style.borderColor = `rgba(62,207,142,${0.12 + 0.45 * pg * (1 - 0.6 * A.p(t, 6.0, 1))})`;
    $("pgtext").style.color = pg > 0.01 ? `rgb(${Math.round(A.lerp(93, 243, pg))},${Math.round(A.lerp(102, 245, pg))},${Math.round(A.lerp(98, 244, pg))})` : "";
    $("pgdot").style.opacity = pg;

    for (const [id, st, du, a, b] of wires) {
      const k = A.p(t, st, du, "io");
      $("w" + id).style.strokeDashoffset = 1 - k;
      $("w" + id).style.opacity = k > 0 ? 1 : 0;
      const pk = $("p" + id);
      pk.setAttribute("cx", A.lerp(a[0], b[0], k)); pk.setAttribute("cy", A.lerp(a[1], b[1], k));
      pk.style.opacity = k > 0 && k < 1 ? 1 : A.clamp(1 - (t - st - du) / 0.25) * (k >= 1 ? 1 : 0);
      const lab = $("l" + id); if (lab) lab.style.opacity = A.lerp(0.35, 1, A.p(t, st, 0.4));
    }
    // column chips pop as JSON becomes typed
    ["c1", "c2", "c3"].forEach((c, i) => {
      const k = A.p(t, 9.9 + i * 0.18, 0.5, "back");
      $(c).style.transform = `scale(${A.lerp(0.85, 1, k)})`;
      $(c).style.borderColor = k > 0.05 && t < 11.4 ? "rgba(62,207,142,.6)" : "";
    });
  }
</script>
