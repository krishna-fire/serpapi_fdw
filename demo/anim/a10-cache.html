engine=google_shopping

      <svg class="hl" style="--d:4.15s;--pad:8px;--r:20px"><rect pathLength="1"/></svg></div>

  </div>
</div>
<script>
  const $ = id => document.getElementById(id);
  function along(path, k) { const p = path.getPointAtLength(k * path.getTotalLength()); return p; }
  function frame(t) {
    // the two calls converge into one canonical key
    const c = A.p(t, 1.55, 0.7, "out");
    $("canon").style.opacity = c; $("canon").style.transform = `scale(${A.lerp(0.94, 1, c)})`;
    [["r1", "k1", 1.0], ["r2", "k2", 1.15]].forEach(([r, k, st]) => {
      const q = A.p(t, st, 0.7, "io"), pt = along($(r), q);
      $(k).setAttribute("cx", pt.x); $(k).setAttribute("cy", pt.y);
      $(k).style.opacity = q > 0 && q < 1 ? 1 : 0;
    });
    // search 1 goes out first: a real search (1 credit)
    const s1 = A.p(t, 2.4, 0.75, "io");
    $("o1").style.strokeDashoffset = 1 - s1;
    // search 2 repeats: answered by the cache (free)
    const s2 = A.p(t, 3.45, 0.75, "io");
    $("o2").style.strokeDashoffset = 1 - s2;
    const pk = s2 > 0 ? $("k2") : $("k1");
    if (t >= 2.4 && t < 4.3) {
      const live = s2 > 0 ? along($("o2"), s2) : along($("o1"), s1);
      pk.setAttribute("cx", live.x); pk.setAttribute("cy", live.y);
      pk.style.opacity = (s2 > 0 ? s2 : s1) < 1 ? 1 : 0;
    }
    const se = A.p(t, 3.1, 0.4, "soft");
    $("search").style.borderColor = se > 0 ? `rgba(139,148,144,${0.3 + 0.5 * se})` : "";
    $("search").style.opacity = A.lerp(0.45, 1, se) * (1 - 0.45 * A.p(t, 3.6, 0.5));
    const ca = A.p(t, 4.15, 0.4, "soft");
    $("cache").style.opacity = A.lerp(0.45, 1, ca);
    $("cache").querySelector("b").style.color = ca > 0.5 ? "#3ECF8E" : "";
  }
</script>
