<script>
  const $ = id => document.getElementById(id);
  const LINE = "create server serpapi … fdw_package_url '…/serpapi_fdw.wasm'";
  const CX = [460, 960, 1460], CY = 644, FROM = [960, 268];
  const AT = [1.5, 2.4, 3.3];
  function frame(t) {
    for (let i = 0; i < 3; i++) {
      const k = A.p(t, AT[i], 0.85, "io");
      const x = A.lerp(FROM[0], CX[i], k);
      const y = A.lerp(FROM[1], CY, k) - Math.sin(Math.PI * k) * 70;   // a small arc
      const f = $("f" + i);
      f.style.opacity = t >= AT[i] ? 1 : 0;
      f.style.transform = `translate(${x}px, ${y}px) scale(${A.lerp(1.25, 1, k)})`;
      const sock = $("s" + i).querySelector(".socket");
      const land = A.p(t, AT[i] + 0.8, 0.4, "soft");
      sock.style.borderColor = land > 0 ? `rgba(62,207,142,${0.2 + 0.45 * land})` : "";
      sock.style.borderStyle = land > 0.5 ? "solid" : "dashed";
      sock.style.background = land > 0 ? `rgba(62,207,142,${0.05 * land})` : "";
      $("s" + i).style.borderColor = land > 0 ? `rgba(62,207,142,${0.35 * land})` : "";
    }
    A.typeText($("ln"), LINE, t, 4.4, 30);
  }
</script>
