<div class="stage">

<script>
  const vault = document.getElementById("vault"), rule = document.getElementById("rule");
  const vl = document.getElementById("vlabel"), vs = document.getElementById("vsub");
  function frame(t) {
    // cylinder glides to centre, flattens toward its rim, and hands off to the title's rule
    const m = A.p(t, 0, 0.8, "io");
    const dx = (960 - 1427) * m, dy = (578 - 517) * m;
    vault.style.transform = `translate(${dx}px, ${dy}px) scale(${1 + 1.1 * m}, ${1 - 0.95 * m})`;
    vault.style.opacity = 1 - A.p(t, 0.45, 0.35, "lin");
    vl.style.opacity = vs.style.opacity = 1 - A.p(t, 0, 0.25, "lin");
    const r = A.p(t, 0.5, 0.7, "out");
    rule.style.opacity = r * (1 - 0.65 * A.p(t, 1.4, 0.8, "soft"));
    rule.style.transform = `scaleX(${0.5 + 0.5 * r})`;
  }
</script>
