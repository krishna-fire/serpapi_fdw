<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>serpapi_fdw · search on demand</title>
<!-- A static page. No server of its own: it signs in with Supabase Auth and calls PostgREST directly.
     Copy config.example.js to config.js and open this file from disk. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="config.js"></script>
<style>
  :root{--bg:#000;--panel:#0f0f11;--line:#232326;--fg:#f5f5f7;--dim:#8e8e93;--faint:#48484a;--blue:#8ab4f8;--green:#6ee7a8;--amber:#ffd166;--red:#ff6b6b;
        --mono:"SF Mono",ui-monospace,Menlo,monospace;--sans:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",Inter,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:baseline;justify-content:space-between;padding:34px 56px 0}
  .brand{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.01em}
  .brand small{font-family:var(--sans);color:var(--dim);margin-left:14px;font-size:15px}
  .meter{display:flex;gap:28px;color:var(--dim);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
  .meter b{display:block;color:var(--fg);font-family:var(--mono);font-size:19px;text-transform:none;letter-spacing:0;margin-top:4px;font-weight:500}
  main{display:grid;align-content:start;gap:18px;padding:30px 56px 40px}
  .row{display:flex;align-items:center;gap:12px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{background:transparent;border:0;color:var(--dim);font:500 13.5px var(--sans);padding:7px 14px;border-radius:8px;cursor:pointer}
  .seg button.on{background:#1c1c1e;color:var(--fg)}
  .who{font-size:13px;color:var(--dim)} .who b{color:var(--fg);font-weight:500}
  .spacer{flex:1}
  #signin{display:none;align-items:center;gap:8px}
  #signin.open{display:flex}
  #signin input{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--fg);font:14px var(--sans);padding:8px 12px;width:220px;outline:none}
  #signin button{background:var(--fg);color:#000;border:0;border-radius:9px;font:600 13px var(--sans);padding:9px 14px;cursor:pointer}
  .query{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:12px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chips button{background:transparent;border:1px solid var(--line);color:var(--dim);font:500 13.5px var(--sans);padding:7px 14px;border-radius:999px;cursor:pointer}
  .chips button.on{border-color:var(--fg);color:var(--fg)}
  .chips .sep{width:1px;background:var(--line);margin:0 6px}
  .qline{display:flex;align-items:center;gap:12px}
  #q{flex:1;background:transparent;border:0;color:var(--fg);font:400 30px var(--sans);letter-spacing:-.01em;padding:8px 6px;outline:none}
  #q::placeholder{color:var(--faint)}
  #run{background:var(--fg);color:#000;border:0;border-radius:11px;font:600 15px var(--sans);padding:12px 22px;cursor:pointer}
  #run:disabled{opacity:.45}
  .reqline{font-family:var(--mono);font-size:14px;color:var(--dim);min-height:20px;padding:0 6px}
  .reqline .ok{color:var(--green)} .reqline .err{color:var(--red)} .reqline .credit{color:var(--amber)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .card h3{margin:0;padding:12px 18px;font:500 12.5px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .card h3 .spacer{flex:1}
  .chip{font-family:var(--mono);text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--fg);background:#1c1c1e;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
  .chip:hover{border-color:var(--fg)}
  .chip .k{color:var(--dim)}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:15.5px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:11px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px 18px;border-bottom:1px solid #151517;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top;max-width:900px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.null{color:var(--faint)}
  tr.new{animation:rise .35s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .state{padding:26px 18px;font-size:16px;color:var(--dim)}
  .state.err{color:var(--red);font-family:var(--mono);font-size:15px}
  .state .code{display:block;font-family:var(--mono);font-size:34px;color:var(--fg);margin-bottom:8px;font-weight:500}
  .md{padding:12px 24px 22px;font-size:16.5px;line-height:1.55;color:#d1d1d6;max-width:1100px}
  .md h1{font-size:23px;margin:.6em 0 .3em;color:var(--fg)} .md h2{font-size:19px;color:var(--fg);margin:.5em 0 .4em} .md a{color:var(--blue);text-decoration:none} .md li{margin:.25em 0} .md em{color:var(--dim)}
  .md .fm{font-family:var(--mono);font-size:12.5px;color:var(--faint);margin:6px 0 4px}
  .md table{font-family:var(--sans);font-size:15px;width:100%;table-layout:auto}
  .md th{padding:8px 12px;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase} .md td{padding:8px 12px;white-space:normal;max-width:none;vertical-align:middle}
  .md td:nth-child(2){min-width:420px}
  .md img{max-height:48px;max-width:86px;border-radius:6px;display:block;object-fit:cover}
  pre.snippet{margin:0;padding:14px 18px;font:14px/1.55 var(--mono);color:#c7c7cc;white-space:pre-wrap}
  pre.snippet .k{color:var(--blue)} pre.snippet .s{color:var(--green)}
</style>
</head>
<body>
<header>
  <div class="brand">serpapi_fdw <small>SerpApi, as SQL. For Supabase and Postgres.</small></div>
  <div class="meter">
    <div>account · hour<b id="m-hour">–</b></div>
    <div>account · month<b id="m-month">–</b></div>
    <div>you · today<b id="m-user">–</b></div>
  </div>
</header>
<main>
  <div class="row">
    <span class="who">who's asking</span>
    <div class="seg" id="who">
      <button data-v="anon" class="on">anonymous</button>
      <button data-v="user">signed in</button>
    </div>
    <span class="who" id="whois"></span>
    <form id="signin" onsubmit="return false">
      <input id="email" type="email" placeholder="email" autocomplete="off">
      <input id="password" type="password" placeholder="password" autocomplete="off">
      <button id="signin-go">Sign in</button>
    </form>
    <div class="spacer"></div>
    <span class="who" id="where"></span>
  </div>

  <div class="query">
    <div class="chips" id="engines">
      <button data-v="google_shopping" class="on">Google Shopping</button>
      <button data-v="amazon">Amazon.in</button>
      <button data-v="google_news">Google News</button>
      <button data-v="google_jobs">Google Jobs</button>
      <button data-v="google_maps">Google Maps</button>
      <span class="sep"></span>
      <button id="mdtoggle">Markdown</button>
    </div>
    <div class="qline">
      <input id="q" placeholder="Search…" value="iPhone 16" autocomplete="off" spellcheck="false">
      <button id="run">Search</button>
    </div>
    <div class="reqline" id="reqline"></div>
  </div>

  <div class="card" id="results">
    <h3>results <span id="count"></span><span class="spacer"></span><span id="receipt"></span></h3>
    <div id="body"><div class="state">Nothing yet.</div></div>
  </div>

  <div class="card" id="snippetcard">
    <h3>what this page just did <span class="spacer"></span><span class="chip" style="cursor:default">no server</span></h3>
    <pre class="snippet" id="snippet">— run a search —</pre>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const P = window.PLAYGROUND || {};
const sb = window.supabase && P.url ? window.supabase.createClient(P.url, P.anonKey, {auth: {persistSession: false}}) : null;
let who = "anon", session = null, engine = "google_shopping", wantMd = false, last = null, lastBudget = null;

const VIEW = {
  google_shopping: [["source", "merchant"], ["extracted_price", "price"], ["extracted_old_price", "was"], ["title", "title"]],
  amazon:          [["asin", "asin"], ["extracted_price", "price"], ["extracted_old_price", "was"], ["title", "title"]],
  google_news:     [["source", "source"], ["date", "date"], ["title", "title"]],
  google_jobs:     [["company_name", "company"], ["location", "location"], ["title", "title"]],
  google_maps:     [["title", "place"], ["rating", "rating"], ["reviews", "reviews"], ["address", "address"]],
};
const PLACEHOLDER = {google_shopping: "iPhone 16", amazon: "iPhone", google_news: "Bengaluru tech hiring", google_jobs: "data engineer", google_maps: "filter coffee Indiranagar"};

$("#where").textContent = P.url ? new URL(P.url).host : "config.js missing";
$("#email").value = P.demoEmail || "";
refreshMeter();

$("#who").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.v === "user" && !session) { $("#signin").classList.add("open"); $("#password").focus(); return; }
  setWho(b.dataset.v);
});
$("#signin-go").addEventListener("click", async () => {
  if (!sb) return;
  const {data, error} = await sb.auth.signInWithPassword({email: $("#email").value, password: $("#password").value});
  if (error) { $("#whois").textContent = "sign-in failed"; return; }
  session = data.session; $("#signin").classList.remove("open"); $("#password").value = "";
  setWho("user");
});
function setWho(v) {
  who = v;
  document.querySelectorAll("#who button").forEach(x => x.classList.toggle("on", x.dataset.v === v));
  $("#whois").innerHTML = v === "user" && session ? `as <b>${esc(session.user.email)}</b>` : "";
  refreshMeter();
}
$("#engines").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "mdtoggle") { wantMd = !wantMd; b.classList.toggle("on", wantMd); return; }
  engine = b.dataset.v;
  document.querySelectorAll("#engines button[data-v]").forEach(x => x.classList.toggle("on", x.dataset.v === engine));
  $("#q").placeholder = PLACEHOLDER[engine] || "Search…";
  if (!$("#q").value || Object.values(PLACEHOLDER).includes($("#q").value)) $("#q").value = PLACEHOLDER[engine] || "";
});
$("#run").addEventListener("click", () => run(false));
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") run(false); });

function token() { return who === "user" && session ? session.access_token : P.anonKey; }
async function rpc(fn, body) {
  const t0 = performance.now();
  const r = await fetch(`${P.url}/rest/v1/rpc/${fn}`, {method: "POST", headers: {apikey: P.anonKey, Authorization: "Bearer " + token(), "Content-Profile": "serpapi", "Content-Type": "application/json"}, body: JSON.stringify(body)});
  let data = null; try { data = await r.json(); } catch {}
  return {status: r.status, ms: Math.round(performance.now() - t0), data};
}
async function budget() { const r = await rpc("budget_status", {}); return r.status === 200 && Array.isArray(r.data) ? r.data : null; }
const used = (rows, w) => (rows || []).find(x => x.window === w)?.used;

async function run(replay) {
  $("#run").disabled = true;
  $("#reqline").innerHTML = `<span>…</span>`;
  const q = $("#q").value.trim();
  let fn, body;
  if (replay && last) { fn = wantMd ? "replay_md" : "replay_" + last.engine; body = {search_id: last.searchId}; }
  else if (wantMd) { fn = "search_md"; body = {engine, params: {q}}; }
  else { fn = engine; body = {q}; }
  const before = lastBudget || await budget();
  const r = await rpc(fn, body);
  const after = await budget(); lastBudget = after;
  const credits = before && after ? used(after, "month") - used(before, "month") : null;
  showSnippet(fn, body);
  const cls = r.status === 200 ? "ok" : "err";
  const creditTxt = credits === null ? "" : ` · <span class="credit">${credits} credit${credits === 1 ? "" : "s"}</span>`;
  $("#reqline").innerHTML = `POST /rest/v1/rpc/${esc(fn)} · <span class="${cls}">${r.status}</span> · ${r.ms} ms${creditTxt}${replay ? " · from SerpApi's archive" : ""}`;
  if (r.status !== 200) showError(r);
  else if (fn.endsWith("_md")) showMarkdown(r.data, replay ? last.engine : engine);
  else showRows(r.data, replay ? last.engine : engine);
  paintMeter(after);
  $("#run").disabled = false;
}
function showError(r) {
  const msg = (r.data && (r.data.message || r.data.hint)) || "request failed";
  $("#body").innerHTML = `<div class="state err"><span class="code">${r.status}</span>${esc(msg)}</div>`;
  $("#count").textContent = ""; $("#receipt").innerHTML = "";
}
function receipt(rows, eng) {
  const id = rows.length ? rows[0].search_id : null;
  if (!id) { $("#receipt").innerHTML = ""; return; }
  last = {engine: eng, searchId: id};
  $("#receipt").innerHTML = `<span class="chip" id="replay" title="replay from SerpApi's archive, free for 31 days"><span class="k">receipt</span> ${esc(id.slice(0, 12))}${id.length > 12 ? "…" : ""} <span class="k">· replay ↺</span></span>`;
  $("#replay").addEventListener("click", () => run(true));
}
function showRows(rows, eng) {
  rows = Array.isArray(rows) ? rows : [rows];
  $("#count").textContent = `${rows.length} row${rows.length === 1 ? "" : "s"}`;
  receipt(rows, eng);
  if (!rows.length) { $("#body").innerHTML = `<div class="state">0 rows</div>`; return; }
  const cols = (VIEW[eng] || Object.keys(rows[0]).map(c => [c, c])).filter(([c]) => c in rows[0]);
  const numeric = c => rows.some(r => typeof r[c] === "number");
  const SHOW = 12, shown = rows.slice(0, SHOW);
  const h = `<thead><tr>${cols.map(([c, l]) => `<th class="${numeric(c) ? "num" : ""}">${esc(l)}</th>`).join("")}</tr></thead>`;
  const b = shown.map((r, i) => `<tr class="new" style="animation-delay:${i * 30}ms">${cols.map(([c]) => cell(r[c])).join("")}</tr>`).join("");
  const more = rows.length > SHOW ? `<div class="state">… and ${rows.length - SHOW} more rows</div>` : "";
  $("#body").innerHTML = `<table>${h}<tbody>${b}</tbody></table>${more}`;
}
function showMarkdown(rows, eng) {
  rows = Array.isArray(rows) ? rows : [rows];
  const md = rows.map(r => typeof r === "string" ? r : (r.markdown || "")).join("\n\n");
  $("#count").textContent = `${md.length.toLocaleString("en-IN")} chars of markdown`;
  receipt(rows, eng);
  // SerpApi's Markdown opens with a YAML front matter (search metadata); fold it so the content leads
  const m = md.match(/^---\n[\s\S]*?\n---\n/);
  const body = m ? md.slice(m[0].length) : md;
  const note = m ? `<p class="fm">front matter (search metadata) folded · ${m[0].split("\n").length - 2} lines</p>` : "";
  $("#body").innerHTML = `<div class="md">${note}${marked.parse(body)}</div>`;
}
function cell(v) {
  if (v === null || v === undefined) return `<td class="null">—</td>`;
  if (typeof v === "number") return `<td class="num">${v.toLocaleString("en-IN")}</td>`;
  if (typeof v === "object") return `<td>${esc(JSON.stringify(v).slice(0, 80))}</td>`;
  return `<td title="${esc(String(v))}">${esc(String(v))}</td>`;
}
function showSnippet(fn, body) {
  const auth = who === "user" && session ? `"Bearer " + session.access_token` : `"Bearer " + ANON_KEY`;
  $("#snippet").innerHTML =
`<span class="k">fetch</span>(<span class="s">"${esc(P.url)}/rest/v1/rpc/${esc(fn)}"</span>, {
  method: <span class="s">"POST"</span>,
  headers: { apikey: ANON_KEY, Authorization: ${esc(auth)}, <span class="s">"Content-Profile"</span>: <span class="s">"serpapi"</span> },
  body: JSON.stringify(${esc(JSON.stringify(body))})
})`;
}
async function refreshMeter() { lastBudget = await budget(); paintMeter(lastBudget); }
function paintMeter(rows) {
  const w = k => (rows || []).find(x => x.window === k);
  $("#m-hour").textContent = w("hour") ? `${w("hour").used} / ${w("hour").cap}` : "–";
  $("#m-month").textContent = w("month") ? `${w("month").used} / ${w("month").cap}` : "–";
  const me = (rows || []).find(x => x.window === "day" && String(x.scope).startsWith("user:"));
  $("#m-user").textContent = me ? `${me.used} / ${me.cap}` : (who === "user" ? "–" : "anonymous");
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c])); }
</script>
</body>
</html>
