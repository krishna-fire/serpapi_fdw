[package]
name = "serpapi_fdw"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "SerpApi as Postgres foreign tables and SQL functions for Supabase Wrappers (Wasm FDW)"
license = "MIT"
repository = "https://github.com/krishna247/serpapi_fdw"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = "0.41.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"

[package.metadata.component]
package = "serpapi:serpapi-fdw"

[package.metadata.component.dependencies]

[package.metadata.component.target]
path = "wit"

[package.metadata.component.target.dependencies]
"supabase:wrappers" = { path = "wit/deps/wrappers" }

[profile.dev]
panic = "unwind"
lto = "thin"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 16
